[project]
name = "entity-pipeline"
version = "0.1.0"
description = "LLM-powered knowledge graph extraction pipeline"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "trafilatura>=2.2.0",
    "wikipedia>=1.4.0",
    "pymupdf>=1.24",
    "tenacity>=9.1.4",
    "pgvector>=0.5.0",
]

[build-system]
requires = [
    "setuptools>=68",
]

build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.models",
    "app.schemas",
    "app.extraction",
    "app.resolution",
    "app.ingestion",
]
